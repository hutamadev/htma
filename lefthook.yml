pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: '*.{js,jsx,ts,tsx}'
      run: bunx oxlint {staged_files}
    prettier:
      glob: '*.{js,jsx,ts,tsx,json,css,md}'
      run: bunx prettier --check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
